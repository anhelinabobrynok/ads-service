<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AdBoard — edit user account">
    <meta name="author" content="Student Lab 1">
    <title>Edit User — AdBoard</title>
    <link rel="stylesheet" href="../css/main.css">
  </head>
  <body>

    <div class="app-shell">

      <!-- Header -->
      <header class="site-header" role="banner">
        <a href="../index.html" class="site-header__logo">Ad<span>Board</span></a>
        <div class="site-header__actions">
          <div class="site-header__location">📍 Lviv, UA</div>
          <div class="site-header__user">
            <div class="site-header__avatar" aria-hidden="true">AD</div>
            <span>admin</span>
          </div>
          <a href="login.html" class="btn--secondary">Logout</a>
          <button class="site-header__menu-toggle" aria-label="Toggle navigation" type="button">☰</button>
        </div>
      </header>

      <!-- Sidebar -->
      <nav class="sidebar" role="navigation" aria-label="Main navigation">
        <p class="sidebar__section-label">Browse</p>
        <a href="../index.html" class="sidebar__nav-link">
          <span class="sidebar__nav-icon" aria-hidden="true">📋</span>All Announcements
        </a>
        <p class="sidebar__section-label">Administration</p>
        <a href="users.html" class="sidebar__nav-link--active" aria-current="page">
          <span class="sidebar__nav-icon" aria-hidden="true">👥</span>Manage Users
        </a>
      </nav>

      <!-- Main content: edit user form -->
      <main class="main-content" role="main">

        <a href="user-info.html" class="announcement-detail__back">← Back to User</a>

        <header class="page-header">
          <div>
            <h1 class="page-header__title">Edit <span>User</span></h1>
            <p class="page-header__subtitle">Editing: john_doe</p>
          </div>
        </header>

        <!-- Edit form card -->
        <div class="announcement-detail">

          <form action="#" method="post" novalidate>

            <!-- Username -->
            <div class="form-group">
              <label class="form-label" for="edit-username">Username</label>
              <input
                class="form-input"
                type="text"
                id="edit-username"
                name="username"
                value="john_doe"
                autocomplete="off"
              >
            </div>

            <!-- New password (optional) -->
            <div class="form-group">
              <label class="form-label" for="edit-password">New Password</label>
              <input
                class="form-input"
                type="password"
                id="edit-password"
                name="password"
                placeholder="Leave blank to keep current"
                autocomplete="new-password"
              >
              <span class="form-hint">Leave blank to keep the existing password.</span>
            </div>

            <!-- Confirm password -->
            <div class="form-group">
              <label class="form-label" for="edit-confirm-password">Confirm New Password</label>
              <input
                class="form-input"
                type="password"
                id="edit-confirm-password"
                name="confirm-password"
                placeholder="Repeat new password"
                autocomplete="new-password"
              >
            </div>

            <!-- Role -->
            <div class="form-group">
              <label class="form-label" for="edit-role">Role</label>
              <select class="form-select" id="edit-role" name="role">
                <option value="regular" selected>Regular User</option>
                <option value="admin">Administrator</option>
              </select>
            </div>

            <!-- Location -->
            <div class="form-group">
              <label class="form-label" for="edit-location">Location (city)</label>
              <input
                class="form-input"
                type="text"
                id="edit-location"
                name="location"
                value="Lviv"
              >
            </div>

            <!-- Form actions -->
            <div style="display:flex; gap:12px; margin-top:8px;">
              <a href="user-info.html" class="btn--secondary">Cancel</a>
              <button class="btn--primary" type="submit">Save Changes</button>
            </div>

          </form>

        </div>

      </main>

    </div>

  </body>
</html>
