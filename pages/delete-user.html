<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AdBoard — confirm user deletion">
    <meta name="author" content="Student Lab 1">
    <title>Delete User — AdBoard</title>
    <link rel="stylesheet" href="../css/main.css">
  </head>
  <body>

    <div class="app-shell">

      <!-- Header -->
      <header class="site-header" role="banner">
        <a href="../index.html" class="site-header__logo">Ad<span>Board</span></a>
        <div class="site-header__actions">
          <div class="site-header__user">
            <div class="site-header__avatar" aria-hidden="true">AD</div>
            <span>admin</span>
          </div>
          <a href="login.html" class="btn--secondary">Logout</a>
          <button class="site-header__menu-toggle" aria-label="Toggle navigation" type="button">☰</button>
        </div>
      </header>

      <!-- Sidebar -->
      <nav class="sidebar" role="navigation" aria-label="Main navigation">
        <p class="sidebar__section-label">Administration</p>
        <a href="users.html" class="sidebar__nav-link--active" aria-current="page">
          <span class="sidebar__nav-icon" aria-hidden="true">👥</span>Manage Users
        </a>
      </nav>

      <!-- Main content: delete confirmation -->
      <main class="main-content" role="main">

        <a href="user-info.html" class="announcement-detail__back">← Back to User</a>

        <!-- Delete confirmation card -->
        <div class="announcement-detail" style="max-width:500px;">

          <div class="alert--error" role="alert">
            <span class="alert__icon" aria-hidden="true">⚠</span>
            <div class="alert__content">
              <p class="alert__title">This action cannot be undone</p>
              <p class="alert__message">
                Deleting a user will permanently remove their account and all associated announcements.
              </p>
            </div>
          </div>

          <h1 class="announcement-detail__title">Delete User?</h1>

          <div class="announcement-detail__meta-row">
            <div class="announcement-detail__meta-item">
              <span class="announcement-detail__meta-label">Username</span>
              <span class="announcement-detail__meta-value">john_doe</span>
            </div>
            <div class="announcement-detail__meta-item">
              <span class="announcement-detail__meta-label">Announcements</span>
              <span class="announcement-detail__meta-value">5 posts will be deleted</span>
            </div>
          </div>

          <!-- Confirmation buttons -->
          <div class="announcement-detail__actions">
            <a href="users.html" class="btn--secondary">Cancel</a>
            <a href="users.html" class="btn--danger">Yes, Delete User</a>
          </div>

        </div>

      </main>

    </div>

  </body>
</html>
